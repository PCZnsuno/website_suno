<!-- ===== JAVASCRIPT ===== -->
<script>
'use strict';

/* ============================================================
   CONSTANTS
   ============================================================ */
const DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
const DAY_SHORT = ['一','二','三','四','五','六','日'];
const DEFAULT_SUBJECTS = [
  { name:'语文', color:'#e74c3c' },
  { name:'数学', color:'#3498db' },
  { name:'英语', color:'#2ecc71' },
  { name:'物理', color:'#9b59b6' },
  { name:'化学', color:'#e67e22' },
  { name:'生物', color:'#1abc9c' },
  { name:'历史', color:'#f39c12' },
  { name:'地理', color:'#16a085' },
  { name:'政治', color:'#8e44ad' },
  { name:'体育', color:'#27ae60' },
  { name:'通用', color:'#7f8c8d' }
];
const SUBJECT_COLORS = {};
DEFAULT_SUBJECTS.forEach(s => SUBJECT_COLORS[s.name] = s.color);
const MAIN_SUBJECTS = ['语文','数学','英语','物理','化学','生物','历史','地理','政治'];
const STORAGE_KEY = 'suno_scheduling_state';

/* ============================================================
   STATE
   ============================================================ */
let state = createDefaultState();
let undoStack = [];
let redoStack = [];
let selectedSubject = 0;
let configTarget = null; // { subject, index }
let importPreviewData = null;
let collapsedPanels = {};

function createDefaultState() {
  return {
    classCount: 2,
    periodsPerDay: 7,
    subjects: JSON.parse(JSON.stringify(DEFAULT_SUBJECTS)),
    classTypes: [{
      name: '普通班',
      mode: '常规',
      weekType: '每周',
      fixedHoursEnabled: false,
      fixedHours: 0,
      allowedSlots: []
    }],
    teachers: {},
    schedule: null,
    errors: [],
    classMeeting: { enabled: false, day: 0, period: 0 },
    remarks: ''
  };
}

/* ============================================================
   UNDO / REDO
   ============================================================ */
function pushUndo() {
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 50) undoStack.shift();
  redoStack = [];
  updateUndoRedoButtons();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(state));
  state = JSON.parse(undoStack.pop());
  updateUndoRedoButtons();
  render();
  showToast('已撤销', 'info');
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(state));
  state = JSON.parse(redoStack.pop());
  updateUndoRedoButtons();
  render();
  showToast('已重做', 'info');
}

function updateUndoRedoButtons() {
  const btnU = document.getElementById('btnUndo');
  const btnR = document.getElementById('btnRedo');
  if (btnU) btnU.style.opacity = undoStack.length ? '1' : '0.4';
  if (btnR) btnR.style.opacity = redoStack.length ? '1' : '0.4';
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function saveToLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

function loadFromLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || typeof data.classCount !== 'number') return false;
    // backward compat: migrate classes -> classTypeAssignments
    if (data.teachers) {
      Object.values(data.teachers).forEach(arr => {
        if (Array.isArray(arr)) {
          arr.forEach(t => {
            if (t.classes && !t.classTypeAssignments) {
              t.classTypeAssignments = {};
              if (data.classTypes && data.classTypes.length) {
                t.classTypeAssignments['0'] = t.classes.slice();
              }
              delete t.classes;
            }
            if (!t.classHours) t.classHours = {};
            // Migrate old classHours format (number → object)
            Object.keys(t.classHours).forEach(c => {
              if (typeof t.classHours[c] === 'number') {
                const h = t.classHours[c];
                t.classHours[c] = { fixed: h, single: 0, double: 0, pending: 0 };
              }
            });
            // Migrate: merge single/double into pending (simplified week model)
            Object.keys(t.classHours).forEach(c => {
              const ch = t.classHours[c];
              if (ch && typeof ch === 'object') {
                if ((ch.single || 0) > 0 || (ch.double || 0) > 0) {
                  ch.pending = (ch.pending || 0) + (ch.single || 0) + (ch.double || 0);
                  ch.single = 0;
                  ch.double = 0;
                }
              }
            });
          });
        }
      });
    }
    if (!data.classTypes || !data.classTypes.length) {
      data.classTypes = [{ name:'普通班', mode:'常规', weekType:'每周', fixedHoursEnabled:false, fixedHours:0, allowedSlots:[] }];
    }
    data.classTypes.forEach(ct => {
      if (!ct.allowedSlots) ct.allowedSlots = [];
      if (ct.fixedHoursEnabled === undefined) ct.fixedHoursEnabled = false;
      // Migrate: '单周'/'双周' → '单双周'
      if (ct.weekType === '单周' || ct.weekType === '双周') ct.weekType = '单双周';
    });
    if (!data.classMeeting) data.classMeeting = { enabled:false, day:0, period:0 };
    if (!data.remarks) data.remarks = '';
    state = data;
    return true;
  } catch(e) { return false; }
}

/* ============================================================
   TOAST
   ============================================================ */
function showToast(msg, type) {
  type = type || 'info';
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity 0.3s'; }, 2200);
  setTimeout(() => t.remove(), 2600);
}

/* ============================================================
   COLLAPSE TOGGLE
   ============================================================ */
function toggleCollapse(name) {
  const body = document.getElementById('body' + capitalize(name));
  const arrow = document.getElementById('arrow' + capitalize(name));
  if (!body || !arrow) return;
  const isCollapsed = body.classList.toggle('collapsed');
  arrow.classList.toggle('open', !isCollapsed);
  collapsedPanels[name] = isCollapsed;
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* ============================================================
   RENDER - MAIN
   ============================================================ */
function render() {
  document.getElementById('inputClassCount').value = state.classCount;
  document.getElementById('inputPeriods').value = state.periodsPerDay;
  renderClassTypes();
  renderMeeting();
  renderSubjectTabs();
  renderTeachers();
  renderSchedule();
  saveToLocal();
}

/* ============================================================
   RENDER - CLASS TYPES
   ============================================================ */
function renderClassTypes() {
  const grid = document.getElementById('typeCardsGrid');
  if (!grid) return;
  let html = '';
  state.classTypes.forEach((ct, i) => {
    const slotsHtml = renderSlotButtons(ct.allowedSlots, state.periodsPerDay, i);
    const feOn = ct.fixedHoursEnabled ? 'on' : '';
    const feLabel = ct.fixedHoursEnabled ? '是' : '否';
    html += `<div class="type-card">
      <div class="type-card-header">
        <input class="type-card-name" value="${esc(ct.name)}" onchange="updateClassType(${i},'name',this.value)">
        <span role="button" tabindex="0" style="font-size:0.75rem;cursor:pointer;color:rgba(255,255,255,0.5)" onclick="deleteClassType(${i})" title="删除">&#10005;</span>
      </div>
      <div class="type-card-body">
        <div class="type-card-row">
          <label>模式</label>
          <select class="type-select" onchange="updateClassType(${i},'mode',this.value)">
            <option value="常规" ${ct.mode==='常规'?'selected':''}>常规</option>
            <option value="走班" ${ct.mode==='走班'?'selected':''}>走班</option>
          </select>
        </div>
        <div class="type-card-row">
          <label>周类型</label>
          <select class="type-select" onchange="updateClassType(${i},'weekType',this.value)">
            <option value="每周" ${ct.weekType==='每周'?'selected':''}>每周</option>
            <option value="单双周" ${ct.weekType==='单双周'?'selected':''}>单双周</option>
          </select>
        </div>
        <div class="type-card-row">
          <label>固定课时</label>
          <span class="toggle-sm ${feOn}" onclick="toggleFixedHours(${i})"><span class="toggle-sm-knob"></span></span>
          <span style="font-size:0.82rem;color:var(--text-secondary)">${feLabel}</span>
          ${ct.fixedHoursEnabled ? `<input class="type-num-input" type="number" min="0" value="${ct.fixedHours||0}" onchange="updateClassType(${i},'fixedHours',parseInt(this.value)||0)">` : ''}
        </div>
        <div class="type-card-row" style="flex-direction:column;align-items:flex-start;">
          <label>允许时段</label>
          <div class="slot-btns">${slotsHtml}</div>
        </div>
      </div>
    </div>`;
  });
  grid.innerHTML = html || '<div class="empty-state"><p>暂无班级种类，请点击下方添加</p></div>';
}

function renderSlotButtons(allowed, ppd, typeIdx) {
  let h = '';
  for (let p = 1; p <= ppd; p++) {
    const active = !allowed.length || allowed.includes(p);
    h += `<span role="button" tabindex="0" class="slot-btn ${active?'active':''}" onclick="toggleSlot(${typeIdx},${p})">${p}</span>`;
  }
  return h;
}

function addClassType() {
  pushUndo();
  state.classTypes.push({
    name: '班种' + (state.classTypes.length + 1),
    mode: '常规',
    weekType: '每周',
    fixedHoursEnabled: false,
    fixedHours: 0,
    allowedSlots: []
  });
  render();
}

function deleteClassType(idx) {
  if (state.classTypes.length <= 1) { showToast('至少保留一个班种', 'warning'); return; }
  pushUndo();
  state.classTypes.splice(idx, 1);
  // fix teacher references
  Object.values(state.teachers).forEach(arr => {
    arr.forEach(t => {
      if (t.classTypeAssignments) {
        const newAssign = {};
        Object.entries(t.classTypeAssignments).forEach(([k, v]) => {
          const ki = parseInt(k);
          if (ki < idx) newAssign[k] = v;
          else if (ki > idx) newAssign[ki - 1] = v;
        });
        t.classTypeAssignments = newAssign;
      }
    });
  });
  render();
}

function updateClassType(idx, field, value) {
  pushUndo();
  state.classTypes[idx][field] = value;
  saveToLocal();
  renderClassTypes();
}

function toggleSlot(typeIdx, slot) {
  pushUndo();
  const ct = state.classTypes[typeIdx];
  const pos = ct.allowedSlots.indexOf(slot);
  if (pos >= 0) ct.allowedSlots.splice(pos, 1);
  else ct.allowedSlots.push(slot);
  ct.allowedSlots.sort((a, b) => a - b);
  saveToLocal();
  renderClassTypes();
}

function toggleFixedHours(idx) {
  pushUndo();
  const ct = state.classTypes[idx];
  ct.fixedHoursEnabled = !ct.fixedHoursEnabled;
  if (ct.fixedHoursEnabled && !ct.fixedHours) ct.fixedHours = 5;
  saveToLocal();
  renderClassTypes();
}

/* ============================================================
   RENDER - MEETING
   ============================================================ */
function renderMeeting() {
  const c = document.getElementById('meetingContent');
  if (!c) return;
  const m = state.classMeeting;
  let dayOpts = '';
  for (let d = 0; d < 7; d++) {
    dayOpts += `<option value="${d}" ${m.day===d?'selected':''}>${DAYS[d]}</option>`;
  }
  let periodOpts = '';
  for (let p = 1; p <= state.periodsPerDay; p++) {
    periodOpts += `<option value="${p-1}" ${m.period===(p-1)?'selected':''}>第${p}节</option>`;
  }
  const preview = m.enabled
    ? `班会安排在每周${DAYS[m.day]}第${m.period+1}节，该时段将被锁定。`
    : '班会未启用。';

  c.innerHTML = `
    <div class="meeting-toggle" onclick="toggleMeeting()">
      <div class="toggle-track ${m.enabled?'on':''}"><div class="toggle-thumb"></div></div>
      <span style="font-size:0.85rem;">${m.enabled?'已启用':'未启用'}</span>
    </div>
    <div class="meeting-config" style="display:${m.enabled?'flex':'none'}">
      <div class="navbar-group">
        <span class="navbar-label">星期</span>
        <select class="type-select" onchange="updateMeeting('day',parseInt(this.value))">${dayOpts}</select>
      </div>
      <div class="navbar-group">
        <span class="navbar-label">节次</span>
        <select class="type-select" onchange="updateMeeting('period',parseInt(this.value))">${periodOpts}</select>
      </div>
    </div>
    <div class="meeting-preview">${preview}</div>`;
}

function toggleMeeting() {
  pushUndo();
  state.classMeeting.enabled = !state.classMeeting.enabled;
  render();
}

function updateMeeting(field, value) {
  pushUndo();
  state.classMeeting[field] = value;
  render();
}

/* ============================================================
   RENDER - SUBJECT TABS
   ============================================================ */
function renderSubjectTabs() {
  const bar = document.getElementById('subjectTabsBar');
  if (!bar) return;
  let html = '';
  state.subjects.forEach((s, i) => {
    const color = s.color || SUBJECT_COLORS[s.name] || '#999';
    html += `<div class="subject-tab ${i===selectedSubject?'active':''}" onclick="selectSubject(${i})">
      <span class="subject-dot" style="background:${color}"></span>
      <span>${esc(s.name)}</span>
      ${state.subjects.length > 1 ? `<span role="button" tabindex="0" class="subject-tab-close" onclick="event.stopPropagation();removeSubject(${i})">&times;</span>` : ''}
    </div>`;
  });
  html += `<span role="button" tabindex="0" class="subject-tab-add" onclick="addSubject()" title="添加科目">+</span>`;
  bar.innerHTML = html;
}

function selectSubject(i) {
  selectedSubject = i;
  renderSubjectTabs();
  renderTeachers();
}

function addSubject() {
  // Toggle inline input
  const existing = document.getElementById('addSubjectInput');
  if (existing) { existing.focus(); return; }
  const bar = document.getElementById('subjectTabsBar');
  const input = document.createElement('input');
  input.id = 'addSubjectInput';
  input.type = 'text';
  input.placeholder = '科目名';
  input.style.cssText = 'width:80px;height:28px;border:1px solid var(--gold);border-radius:4px;padding:0 8px;font-size:0.82rem;font-family:var(--font-serif);outline:none;margin-left:4px;';
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const val = input.value.trim();
      if (val) {
        pushUndo();
        const colors = ['#c0392b','#2980b9','#27ae60','#8e44ad','#d35400','#16a085','#f39c12','#2c3e50','#e74c3c','#1abc9c'];
        state.subjects.push({ name: val, color: colors[state.subjects.length % colors.length] });
        selectedSubject = state.subjects.length - 1;
        render();
      }
    } else if (e.key === 'Escape') {
      input.remove();
    }
  });
  input.addEventListener('blur', function() { setTimeout(() => input.remove(), 200); });
  bar.appendChild(input);
  input.focus();
}

function removeSubject(i) {
  if (state.subjects.length <= 1) { showToast('至少保留一个科目', 'warning'); return; }
  const subj = state.subjects[i].name;
  pushUndo();
  delete state.teachers[subj];
  state.subjects.splice(i, 1);
  if (selectedSubject >= state.subjects.length) selectedSubject = state.subjects.length - 1;
  render();
  showToast(`已删除科目 "${subj}"，可撤销恢复`, 'success');
}

/* ============================================================
   RENDER - TEACHERS
   ============================================================ */
function renderTeachers() {
  const subj = state.subjects[selectedSubject];
  if (!subj) return;
  const subjName = subj.name;
  const teachers = state.teachers[subjName] || [];

  // Info bar
  let totalTeachers = 0;
  Object.values(state.teachers).forEach(arr => { totalTeachers += arr.length; });
  const errCount = state.errors.length;

  const infoBar = document.getElementById('teacherInfoBar');
  if (infoBar) {
    infoBar.innerHTML = `<div class="info-bar">
      <div class="info-item"><span class="label">班级数</span><span class="value">${state.classCount}</span></div>
      <div class="info-item"><span class="label">每天课时</span><span class="value">${state.periodsPerDay}</span></div>
      <div class="info-item"><span class="label">教师总数</span><span class="value">${totalTeachers}</span></div>
      <div class="info-item"><span class="label">冲突/错误</span><span class="value ${errCount?'error':''}">${errCount}</span></div>
      <div class="info-item"><span class="label">当前科目</span><span class="value" style="color:${subj.color||'#999'}">${esc(subjName)}</span></div>
    </div>`;
  }

  const wrap = document.getElementById('teacherTableWrap');
  if (!wrap) return;

  if (!teachers.length) {
    wrap.innerHTML = '<div class="empty-state"><p>当前科目暂无教师，请点击下方添加</p></div>';
    return;
  }

  let tableHtml = `<table class="teacher-table">
    <thead><tr>
      <th>序号</th><th>姓名</th><th>简称</th><th>任教班级</th><th>周课时</th><th>班种</th><th>操作</th>
    </tr></thead><tbody>`;

  teachers.forEach((t, i) => {
    // Build class display per type
    let classDisplay = '';
    let typeDisplay = '';
    if (t.classTypeAssignments) {
      const parts = [];
      const tParts = [];
      Object.entries(t.classTypeAssignments).forEach(([ti, cls]) => {
        const ct = state.classTypes[parseInt(ti)];
        if (!ct || !cls.length) return;
        parts.push(`<span class="class-type-label">${esc(ct.name)}</span>: ${cls.join(',')}`);
        tParts.push(`${esc(ct.name)}(${ct.mode})`);
      });
      classDisplay = parts.join(' | ') || '-';
      typeDisplay = tParts.join('，') || '-';
    }

    // Hours display
    let totalH = 0;
    if (t.classHours) {
      Object.values(t.classHours).forEach(ch => {
        if (typeof ch === 'number') totalH += ch;
        else totalH += (ch.fixed || 0) + (ch.single || 0) + (ch.double || 0) + (ch.pending || 0);
      });
    }
    if (!totalH && t.hours) totalH = t.hours;

    tableHtml += `<tr>
      <td style="color:var(--text-light);font-size:0.78rem;">${i+1}</td>
      <td><strong>${esc(t.name)}</strong></td>
      <td>${esc(t.abbr)}</td>
      <td style="font-size:0.78rem;">${classDisplay}</td>
      <td style="font-family:var(--font-garamond);font-weight:600;">${totalH}</td>
      <td style="font-size:0.78rem;">${typeDisplay}</td>
      <td>
        <span role="button" tabindex="0" class="action-btn" onclick="openConfigModal('${esc(subjName)}',${i})">配置</span>
        <span role="button" tabindex="0" class="action-btn danger" onclick="deleteTeacher('${esc(subjName)}',${i})">删除</span>
      </td>
    </tr>`;
  });

  tableHtml += '</tbody></table>';
  wrap.innerHTML = tableHtml;
}

function addTeacher() {
  const subj = state.subjects[selectedSubject];
  if (!subj) return;
  pushUndo();
  if (!state.teachers[subj.name]) state.teachers[subj.name] = [];
  const idx = state.teachers[subj.name].length;
  state.teachers[subj.name].push({
    name: '教师' + (idx + 1),
    abbr: '教' + (idx + 1),
    classTypeAssignments: {},
    hours: 0,
    classHours: {}
  });
  render();
}

function deleteTeacher(subjName, idx) {
  pushUndo();
  const name = state.teachers[subjName][idx].name;
  state.teachers[subjName].splice(idx, 1);
  render();
  showToast(`已删除教师 "${name}"，可撤销恢复`, 'success');
}

/* ============================================================
   TEACHER CONFIG MODAL
   ============================================================ */
function openConfigModal(subjName, tIdx) {
  configTarget = { subject: subjName, index: tIdx };
  const t = state.teachers[subjName][tIdx];
  document.getElementById('configModalTitle').textContent = `配置 - ${t.name}（${subjName}）`;
  renderConfigModalBody(t);
  document.getElementById('configModalOverlay').classList.add('show');
}

function closeConfigModal() {
  document.getElementById('configModalOverlay').classList.remove('show');
  configTarget = null;
}

function renderConfigModalBody(t) {
  const body = document.getElementById('configModalBody');
  const N = state.classCount;
  const cts = state.classTypes;

  // Build allAssigned set
  const allAssigned = new Set();
  Object.values(t.classTypeAssignments || {}).forEach(cls => cls.forEach(c => allAssigned.add(c)));

  // Pool
  let poolHtml = '<div class="pool-label">选择班级（点击选中，再点下方「添加」按钮分配到班种）</div><div class="config-class-pool">';
  for (let c = 1; c <= N; c++) {
    const sel = allAssigned.has(c) ? ' selected' : '';
    poolHtml += `<span role="button" tabindex="0" class="pool-chip${sel}" onclick="togglePoolChip(this,${c})">${c}班</span>`;
  }
  poolHtml += '</div>';

  // Per-type sections
  let typeHtml = '';
  cts.forEach((ct, ti) => {
    const assigned = (t.classTypeAssignments && t.classTypeAssignments[ti]) || [];
    let tagsHtml = '';
    assigned.forEach(c => {
      tagsHtml += `<span class="type-tag">${c}班 <span class="rm" onclick="removeFromClassType(${ti},${c})">&times;</span></span>`;
    });
    if (!assigned.length) tagsHtml = '<span style="color:var(--text-light);font-size:0.78rem;">未分配班级</span>';

    typeHtml += `<div class="type-section">
      <div class="type-section-header">
        <span>${esc(ct.name)} <span class="type-section-badge">${ct.mode}</span></span>
        <span class="type-section-badge">${ct.weekType}</span>
      </div>
      <div class="type-section-body"><div class="type-section-tags">${tagsHtml}</div></div>
      <div class="type-section-footer">
        <span role="button" tabindex="0" class="type-add-btn" onclick="addPoolToType(${ti})">+ 添加选中班级到此班种</span>
      </div>
    </div>`;
  });

  // Total hours
  const totalH = t.hours || 0;

  // Per-class hours table
  const assignedClasses = [];
  Object.values(t.classTypeAssignments || {}).forEach(cls => cls.forEach(c => { if (!assignedClasses.includes(c)) assignedClasses.push(c); }));
  assignedClasses.sort((a, b) => a - b);
  const classHours = t.classHours || {};

  let hoursHtml = '';
  if (assignedClasses.length) {
    // Gather type names per class
    const classNames = {};
    Object.entries(t.classTypeAssignments || {}).forEach(([ti, cls]) => {
      const ct = state.classTypes[parseInt(ti)];
      if (!ct) return;
      cls.forEach(c => {
        if (!classNames[c]) classNames[c] = [];
        classNames[c].push(ct.name);
      });
    });

    hoursHtml = `<div class="hours-section">
      <div class="hours-section-title">&#9202; 各班课时分配</div>
      <table class="hours-table" id="hoursTable">
        <thead><tr><th>班级</th><th>班种</th><th>固定课时</th><th>待定</th><th>合计</th></tr></thead><tbody>`;
    assignedClasses.forEach(c => {
      const ch = classHours[c] || {};
      const fixed = ch.fixed || 0;
      const pending = (ch.pending || 0) + (ch.single || 0) + (ch.double || 0);
      const total = fixed + pending;
      hoursHtml += `<tr>
        <td>${c}班</td>
        <td style="font-size:0.78rem;color:var(--text-secondary)">${esc((classNames[c]||[]).join(','))}</td>
        <td><input type="number" min="0" value="${fixed}" onchange="onHoursChange(${c},'fixed',this.value)" style="width:40px"></td>
        <td><input type="number" min="0" value="${pending}" onchange="onHoursChange(${c},'pending',this.value)" style="width:40px"></td>
        <td style="text-align:center;font-weight:600;color:var(--navy)">${total}</td>
      </tr>`;
    });
    hoursHtml += '</tbody></table>';

    // Summary
    let sumFixed = 0, sumPending = 0;
    assignedClasses.forEach(c => {
      const ch = classHours[c] || {};
      sumFixed += ch.fixed || 0;
      sumPending += (ch.pending || 0) + (ch.single || 0) + (ch.double || 0);
    });
    const sumTotal = sumFixed + sumPending;
    let summaryText = `合计: ${sumTotal}`;
    if (sumFixed > 0) summaryText += ` | 固定: ${sumFixed}`;
    if (sumPending > 0) summaryText += ` | 待定: ${sumPending}`;
    const match = sumTotal === totalH;
    hoursHtml += `<div class="hours-summary ${match?'match':'mismatch'}">${summaryText}</div></div>`;
  }

  // Preview
  const previewText = buildPreviewText(t);

  body.innerHTML = `
    <div style="margin-bottom:10px;">
      <div class="type-card-row" style="margin-bottom:8px;">
        <label>姓名</label>
        <input class="type-select" style="width:120px;" value="${esc(t.name)}" oninput="onConfigFieldChange('name',this.value)">
      </div>
      <div class="type-card-row">
        <label>简称</label>
        <input class="type-select" style="width:80px;" value="${esc(t.abbr)}" oninput="onConfigFieldChange('abbr',this.value)">
      </div>
    </div>
    ${poolHtml}
    ${typeHtml}
    <div style="margin-top:14px;">
      <div class="type-card-row">
        <label>总周课时</label>
        <input class="type-num-input" type="number" min="0" value="${totalH}" onchange="onTotalHoursChange(parseInt(this.value)||0)">
      </div>
    </div>
    ${hoursHtml}
    <div class="config-preview">${previewText}</div>`;
}

function onConfigFieldChange(field, value) {
  if (!configTarget) return;
  const t = state.teachers[configTarget.subject][configTarget.index];
  t[field] = value;
  document.getElementById('configModalTitle').textContent = `配置 - ${t.name}（${configTarget.subject}）`;
}

function onTotalHoursChange(val) {
  if (!configTarget) return;
  const t = state.teachers[configTarget.subject][configTarget.index];
  t.hours = val;
  redistributeHours(t);
  renderConfigModalBody(t);
}

function onHoursChange(classNum, field, rawVal) {
  if (!configTarget) return;
  const t = state.teachers[configTarget.subject][configTarget.index];
  if (!t.classHours) t.classHours = {};
  if (!t.classHours[classNum]) t.classHours[classNum] = { fixed: 0, single: 0, double: 0, pending: 0 };

  const ch = t.classHours[classNum];
  const val = Math.max(0, parseInt(rawVal) || 0);
  ch[field] = val;

  // When editing pending, clear legacy single/double to avoid double-counting
  if (field === 'pending') {
    ch.single = 0;
    ch.double = 0;
  }

  // Update total to match sum across all classes
  let sum = 0;
  Object.values(t.classHours).forEach(cc => {
    sum += (cc.fixed || 0) + (cc.pending || 0) + (cc.single || 0) + (cc.double || 0);
  });
  t.hours = sum;
  renderConfigModalBody(t);
}

function togglePoolChip(el) {
  el.classList.toggle('selected');
}

function addPoolToType(typeIdx) {
  if (!configTarget) return;
  const t = state.teachers[configTarget.subject][configTarget.index];
  if (!t.classTypeAssignments) t.classTypeAssignments = {};

  // Get selected pool chips
  const chips = document.querySelectorAll('#configModalBody .pool-chip.selected');
  const selected = [];
  chips.forEach(chip => {
    const n = parseInt(chip.textContent);
    if (!isNaN(n)) selected.push(n);
  });
  if (!selected.length) { showToast('请先在上方选择班级', 'warning'); return; }

  // Only add to target type, do NOT remove from other types
  if (!t.classTypeAssignments[typeIdx]) t.classTypeAssignments[typeIdx] = [];
  selected.forEach(c => {
    if (!t.classTypeAssignments[typeIdx].includes(c)) {
      t.classTypeAssignments[typeIdx].push(c);
    }
  });
  t.classTypeAssignments[typeIdx].sort((a, b) => a - b);

  redistributeHours(t);
  renderConfigModalBody(t);
}

function removeFromClassType(typeIdx, classNum) {
  if (!configTarget) return;
  const t = state.teachers[configTarget.subject][configTarget.index];
  if (t.classTypeAssignments && t.classTypeAssignments[typeIdx]) {
    const idx = t.classTypeAssignments[typeIdx].indexOf(classNum);
    if (idx >= 0) t.classTypeAssignments[typeIdx].splice(idx, 1);
  }
  redistributeHours(t);
  renderConfigModalBody(t);
}

function redistributeHours(t) {
  const classes = [];
  Object.values(t.classTypeAssignments || {}).forEach(cls => cls.forEach(c => { if (!classes.includes(c)) classes.push(c); }));
  classes.sort((a, b) => a - b);
  const total = t.hours || 0;
  if (!classes.length) { t.classHours = {}; return; }

  // Preserve existing per-class breakdown, just redistribute evenly as fixed
  const n = classes.length;
  const base = Math.floor(total / n);
  let remainder = total - base * n;
  t.classHours = {};
  classes.forEach(c => {
    const h = base + (remainder > 0 ? 1 : 0);
    t.classHours[c] = { fixed: h, single: 0, double: 0, pending: 0 };
    if (remainder > 0) remainder--;
  });
}

function buildPreviewText(t) {
  const parts = [];
  parts.push(`<strong>${esc(t.name)}</strong>（${esc(t.abbr)}）`);
  Object.entries(t.classTypeAssignments || {}).forEach(([ti, cls]) => {
    const ct = state.classTypes[parseInt(ti)];
    if (!ct || !cls.length) return;
    parts.push(`${esc(ct.name)}[${ct.mode},${ct.weekType}]: ${cls.map(c => c+'班').join('、')}`);
  });
  return parts.join('<br>');
}

function saveConfigModal() {
  if (!configTarget) return;
  pushUndo();
  closeConfigModal();
  render();
  showToast('教师配置已保存', 'success');
}

/* ============================================================
   RENDER - SCHEDULE
   ============================================================ */
function renderSchedule() {
  const c = document.getElementById('scheduleContent');
  if (!c) return;
  const sched = state.schedule;
  if (!sched) {
    c.innerHTML = `<div class="empty-state">
      <p>尚未排课，请配置教师后点击"智能排课"按钮</p>
    </div>
    <div class="remarks-section">
      <label style="font-size:0.85rem;font-weight:600;color:var(--navy);">备注</label>
      <textarea placeholder="在此输入备注信息..." onchange="state.remarks=this.value;saveToLocal()">${esc(state.remarks||'')}</textarea>
    </div>`;
    return;
  }

  const N = sched.grid[0] && sched.grid[0][0] ? sched.grid[0][0].length : state.classCount;
  const ppd = state.periodsPerDay;
  const grid = sched.grid;
  const walkGrid = sched.walkGrid;
  const m = state.classMeeting;
  const amEnd = Math.ceil(ppd / 2); // morning session end

  // ------- Title -------
  let html = '<h2 style="text-align:center;font-family:var(--font-serif);margin:8px 0 4px;font-size:1.1rem;letter-spacing:2px;">课程表</h2>';

  html += '<div class="schedule-wrap"><table class="schedule-table">';

  // ------- Header -------
  html += '<thead>';

  // Row 1: day headers (spanning across class columns + walk)
  html += '<tr><th rowspan="2" class="period-label">节</th>';
  for (let d = 0; d < 5; d++) {
    html += `<th colspan="${N+1}" class="day-header">${DAYS[d]}</th>`;
  }
  html += '</tr>';

  // Row 2: class numbers (repeated per day) + walk column
  html += '<tr>';
  for (let d = 0; d < 5; d++) {
    for (let ci = 0; ci < N; ci++) {
      html += `<th class="class-num-header">${ci+1}</th>`;
    }
    html += '<th class="walk-header">走班</th>';
  }
  html += '</tr></thead>';

  // ------- Body -------
  html += '<tbody>';

  for (let p = 0; p < ppd; p++) {
    // Lunch break separator
    if (p === amEnd) {
      html += `<tr class="lunch-sep"><td class="period-num lunch-label" style="background:linear-gradient(90deg,rgba(200,150,62,0.05),rgba(200,150,62,0.1));">午<br>休</td>`;
      for (let d = 0; d < 5; d++) {
        html += `<td colspan="${N+1}" class="lunch-row"></td>`;
      }
      html += '</tr>';
    }

    const isPM = p >= amEnd;
    html += '<tr>';

    // Period label
    html += `<td class="period-num">${isPM ? '下' : '上'}<br>${p+1}</td>`;

    for (let d = 0; d < 5; d++) {
      // Meeting
      if (m.enabled && d === m.day && p === m.period) {
        html += `<td colspan="${N}" class="meeting-cell" style="background:rgba(243,156,18,0.08);"><span class="meeting-text">班&nbsp;&nbsp;会</span></td>`;
        html += '<td class="walk-col" style="background:rgba(243,156,18,0.08);"></td>';
      } else {
        // Class cells
        for (let ci = 0; ci < N; ci++) {
          const cell = grid[d] && grid[d][p] ? grid[d][p][ci] : null;
          if (cell) {
            // Split text into vertical characters
            const txt = (cell.sub || '') + (cell.abbr || '');
            const vertLabel = txt.split('').join('<br>');
            const oeTag = cell.oddEven ? `<span class="oe-tag ${cell.oddEven}">${cell.oddEven==='odd'?'单':cell.oddEven==='even'?'双':'待'}</span>` : '';
            // Paired course (opposite odd/even week)
            let pairedHtml = '';
            let cellClass = 'class-cell';
            if (cell.paired) {
              const pTxt = (cell.paired.sub || '') + (cell.paired.abbr || '');
              const pVertLabel = pTxt.split('').join('<br>');
              const pTag = cell.paired.oddEven ? `<span class="oe-tag ${cell.paired.oddEven}">${cell.paired.oddEven==='odd'?'单':'双'}</span>` : '';
              pairedHtml = `<div class="cell-paired"><span class="cell-label-sm">${pVertLabel}</span>${pTag}</div>`;
              cellClass += ' paired-cell';
            }
            html += `<td class="${cellClass}"><span class="cell-label">${vertLabel}</span>${oeTag}${pairedHtml}</td>`;
          } else {
            html += '<td class="class-cell empty"></td>';
          }
        }
        // Walk column
        const wCell = walkGrid[d] && walkGrid[d][p] ? walkGrid[d][p] : null;
        if (wCell) {
          const wTxt = (wCell.sub || '') + (wCell.abbr || '');
          const wVertLabel = wTxt.split('').join('<br>');
          html += `<td class="walk-col"><span class="cell-label">${wVertLabel}</span></td>`;
        } else {
          html += '<td class="walk-col"></td>';
        }
      }
    }
    html += '</tr>';
  }

  html += '</tbody></table></div>';

  // ------- Legend -------
  let placedTotal = 0, totalSlots = 5 * ppd * N;
  for (let d=0;d<5;d++) for (let p=0;p<ppd;p++) for (let ci=0;ci<N;ci++) if(grid[d][p][ci]) placedTotal++;
  const usedPct = totalSlots ? Math.round(placedTotal/totalSlots*100) : 0;
  html += `<div style="margin-top:8px;font-size:0.78rem;color:var(--text-secondary);text-align:center;">已排 ${placedTotal} 节课，覆盖率 ${usedPct}%</div>`;

  // Errors
  if (state.errors.length) {
    html += '<div style="margin-top:12px;padding:10px;background:rgba(192,57,43,0.05);border-radius:var(--radius);border:1px solid rgba(192,57,43,0.15);">';
    html += '<div style="font-weight:600;color:var(--danger);margin-bottom:6px;font-size:0.85rem;">排课冲突/警告:</div>';
    state.errors.forEach(e => {
      html += `<div style="font-size:0.82rem;color:var(--danger-light);padding:2px 0;">- ${esc(e)}</div>`;
    });
    html += '</div>';
  }

  // Remarks
  html += `<div class="remarks-section">
    <label style="font-size:0.85rem;font-weight:600;color:var(--navy);">备注</label>
    <textarea placeholder="在此输入备注信息..." onchange="state.remarks=this.value;saveToLocal()">${esc(state.remarks||'')}</textarea>
  </div>`;

  c.innerHTML = html;
}

/* ============================================================
   SCHEDULING ALGORITHM — 以班级为单位填满所有时段
   ============================================================ */

// Helper: get effective hours from classHours (handles old number + new object format)
function getClassHours(t, classNum) {
  const ch = t.classHours && t.classHours[classNum];
  if (!ch) return 0;
  if (typeof ch === 'object') return (ch.fixed||0)+(ch.single||0)+(ch.double||0)+(ch.pending||0);
  if (typeof ch === 'number') return ch;
  return 0;
}

// Build per-class demand: classNum -> { demandKey -> { teacherName, abbr, hours, typeMode, allowedSlots, oddEven, subject } }
function buildClassDemand() {
  const demand = {};
  state.subjects.forEach(subj => {
    (state.teachers[subj.name]||[]).forEach(t => {
      Object.entries(t.classTypeAssignments||{}).forEach(([ti,cls]) => {
        const ct = state.classTypes[parseInt(ti)];
        if (!ct) return;
        cls.forEach(cn => {
          const key = String(cn);
          if (!demand[key]) demand[key] = {};
          const ch = t.classHours && t.classHours[cn];
          if (!ch) return;
          const fixedH = (ch.fixed||0);
          const pendingH = (ch.pending||0) + (ch.single||0) + (ch.double||0); // merge legacy fields

          // Only read hours that match this class type's weekType
          if (ct.weekType === '每周') {
            // Weekly type: only read fixed hours
            if (fixedH > 0) {
              const dk = subj.name + '|每周';
              if (!demand[key][dk]) {
                demand[key][dk] = {
                  subject:subj.name, teacherName:t.name, abbr:t.abbr, hours:0,
                  typeMode:ct.mode, allowedSlots:ct.allowedSlots||[], oddEven:null
                };
              }
              demand[key][dk].hours += fixedH;
            }
          } else if (ct.weekType === '单双周') {
            // Odd/even type: only read pending hours
            if (pendingH > 0) {
              const dk = subj.name + '|单双周';
              if (!demand[key][dk]) {
                demand[key][dk] = {
                  subject:subj.name, teacherName:t.name, abbr:t.abbr, hours:0,
                  typeMode:ct.mode, allowedSlots:ct.allowedSlots||[], oddEven:'flex'
                };
              }
              demand[key][dk].hours += pendingH;
            }
          }
        });
      });
    });
  });
  return demand;
}

// Teacher key: uniquely identifies a teacher across subjects
function teacherKey(abbr, classNum) { return abbr+'|'+classNum; }

function tKeyMatch(cell, abbr) {
  return cell && cell._teacherKey && cell._teacherKey.startsWith(abbr+'|');
}

// Count how many periods a teacher (by abbr) already has on day d (including paired)
function tCountOnDay(abbr, d, grid, N, ppd) {
  let c = 0;
  for (let p=0;p<ppd;p++) for (let ci=0;ci<N;ci++) {
    const cell = grid[d][p][ci];
    if (!cell) continue;
    if (cell.abbr === abbr) c++;
    if (cell.paired && cell.paired.abbr === abbr) c++;
  }
  return c;
}

// Count how many times a subject appears for a class on day d (excluding paired entries of opposite week)
function subjCountOnDay(subj, classNum, d, grid, N, ppd, entryOE) {
  const ci = classNum-1;
  if (ci<0||ci>=N) return 0;
  let c = 0;
  for (let p=0;p<ppd;p++) {
    const cell = grid[d][p][ci];
    if (!cell || cell.sub !== subj) continue;
    // If checking an odd/even entry, don't count opposite-week paired entries as separate
    if (entryOE && cell.oddEven && cell.oddEven !== entryOE) continue;
    c++;
  }
  return c;
}

// Check if slot (d,p) is free for a given (class,subject) demand entry
function slotOk(d, p, classNum, info, grid, N, ppd, m, strict) {
  if (m&&m.enabled&&d===m.day&&p===m.period) return false;
  if (info.allowedSlots&&info.allowedSlots.length>0&&!info.allowedSlots.includes(p+1)) return false;
  const ci = classNum-1;
  if (ci<0||ci>=N) return false;
  const existing = grid[d][p][ci];
  if (existing) {
    if (existing.paired) return false; // Cell already has2 courses, no more
    if (!info.oddEven || !existing.oddEven) {
      if (strict) return false; // strict: both must have odd/even
      // relaxed: allow regular course to be placed (will be handled by swap)
      return false;
    }
    // Allow if: different types, OR either is flex (undetermined)
    if (info.oddEven === existing.oddEven && info.oddEven !== 'flex') return false;
  }
  // Teacher conflict (skip if abbr is empty)
  if (info.abbr) {
    const existingCell = grid[d] && grid[d][p] ? grid[d][p][ci] : null;
    // If this is a pairing scenario (same class, same cell, odd+even), allow same teacher
    const isPairing = existingCell && existingCell.oddEven && info.oddEven && !existingCell.paired;
    for (let ci2=0;ci2<N;ci2++) {
      if (ci2===ci) continue; // skip same class
      const cell = grid[d][p][ci2];
      if (!cell) continue;
      if (cell._teacherKey&&cell._teacherKey.startsWith(info.abbr+'|')) return false;
      if (cell.paired&&cell.paired._teacherKey&&cell.paired._teacherKey.startsWith(info.abbr+'|')) return false;
    }
  }
  return true;
}

function runScheduling() {
  pushUndo();
  state.errors = [];
  state.schedule = null;

  const ppd = state.periodsPerDay;
  const m = state.classMeeting;

  const demand = buildClassDemand();
  const classNums = Object.keys(demand).map(Number).sort((a,b)=>a-b);

  // Auto-detect N from data: use max of state.classCount and actual class numbers
  let N = state.classCount;
  classNums.forEach(c => { if (c > N) N = c; });
  // Also scan teachers directly for any classNum beyond classCount
  state.subjects.forEach(subj => {
    (state.teachers[subj.name]||[]).forEach(t => {
      Object.values(t.classTypeAssignments||{}).forEach(cls => {
        cls.forEach(c => { if (c > N) N = c; });
      });
    });
  });

  console.log('[排课] Grid N:', N, 'state.classCount:', state.classCount, '节/天:', ppd, '有需求班:', classNums);
  if (!classNums.length) {
    showToast('没有可排课的班级（请先配置教师并分配班级课时）','warning');
    return;
  }

  // Validate per-class hours
  const totalSlots = 5*ppd - (m&&m.enabled?1:0);
  const warnings = [];
  let totalDemand = 0;
  classNums.forEach(c => {
    let t = 0;
    Object.values(demand[String(c)]).forEach(v=>t+=v.hours);
    totalDemand += t;
    if (t<totalSlots) warnings.push(`${c}班:${t}h < ${totalSlots}空位`);
    else if (t>totalSlots) warnings.push(`${c}班:${t}h > ${totalSlots}空位`);
  });
  console.log('[排课] 总需求课时:', totalDemand, '可用时段:', totalSlots*classNums.length);
  if (warnings.length) showToast(warnings.slice(0,2).join('；')+(warnings.length>2?'…':''),'warning');

  // Diagnostic: dump teacher hours for key subjects
  ['体育','通用技术','政治','地理','信息技术','美术','音乐'].forEach(subjName => {
    const teachers = state.teachers[subjName];
    if (!teachers) return;
    teachers.forEach(t => {
      const totalH = Object.values(t.classHours||{}).reduce((s,ch)=>{
        if (typeof ch==='number') return s+ch;
        return s+(ch.fixed||0)+(ch.pending||0)+(ch.single||0)+(ch.double||0);
      },0);
      if (totalH===0) return;
      const cls = Object.keys(t.classHours||{}).filter(c=>{
        const ch=t.classHours[c];
        if (typeof ch==='number') return ch>0;
        return (ch.fixed||0)+(ch.pending||0)+(ch.single||0)+(ch.double||0)>0;
      });
      const details = cls.map(c=>{
        const ch=t.classHours[c];
        if (typeof ch==='number') return `${c}班:${ch}`;
        return `${c}班:f=${ch.fixed||0},p=${ch.pending||0},s=${ch.single||0},d=${ch.double||0}`;
      }).join(' ');
      console.log(`[诊断] ${subjName} ${t.name}(${t.abbr}): ${details} 合计:${totalH}`);
    });
  });

  // Pre-process: assign flex (单双周) courses to odd/even
  // Strategy: first group flex entries by teacher, alternate odd/even per teacher
  //          Then for each class, if both subjects got same parity, swap one
  //          This ensures: 1) teacher balance across weeks, 2) different subjects can pair
  const teacherFlexEntries = {}; // abbr -> [{classNum, demandKey}]
  Object.entries(demand).forEach(([classNum, classDemand]) => {
    Object.entries(classDemand).forEach(([dk, info]) => {
      if (info.oddEven !== 'flex') return;
      const key = info.abbr || ('_' + info.subject);
      if (!teacherFlexEntries[key]) teacherFlexEntries[key] = [];
      teacherFlexEntries[key].push({ classNum: parseInt(classNum), demandKey: dk, info });
    });
  });
  // Assign odd/even alternating per teacher
  Object.values(teacherFlexEntries).forEach(entries => {
    entries.sort((a, b) => a.classNum - b.classNum);
    let useOdd = true;
    entries.forEach(entry => {
      entry.info.oddEven = useOdd ? 'odd' : 'even';
      useOdd = !useOdd;
    });
  });
  // Fix: for each class, if multiple flex entries have same parity, swap to alternate
  classNums.forEach(c => {
    const classDemand = demand[String(c)];
    if (!classDemand) return;
    const flexEntries = Object.entries(classDemand).filter(([dk, info]) => info.oddEven === 'odd' || info.oddEven === 'even');
    if (flexEntries.length < 2) return;
    // Check if all same parity - if so, alternate
    const parities = flexEntries.map(([dk, info]) => info.oddEven);
    const allSame = parities.every(p => p === parities[0]);
    if (allSame) {
      // Alternate: first stays, rest swap
      for (let i = 1; i < flexEntries.length; i++) {
        flexEntries[i][1].oddEven = (parities[0] === 'odd') ? 'even' : 'odd';
      }
    }
  });

  // Multi-restart for best result
  let best = null;
  for (let r=0;r<80;r++) {
    const res = scheduleOnce(demand, classNums, N, ppd, m, r);
    if (!best||res.placed>best.placed) best=res;
    if (res.unplaced===0) break;
  }

  const finalWalkGrid = best.walkGrid || [];

  state.schedule = { grid:best.grid, walkGrid: finalWalkGrid };
  state.errors = best.errors;
  renderSchedule();

  setTimeout(()=>{
    const el=document.getElementById('scheduleCard');
    if (el) el.scrollIntoView({behavior:'smooth',block:'start'});
  },200);

  const empty = countEmpty(best.grid, N, ppd);
  if (!best.errors.length&&!empty) showToast(`排课完成！所有班级全部填满（${totalDemand}节课）`,'success');
  else if (!best.errors.length) showToast(`排课完成：${totalDemand}节已排，${empty}空位待补充`,'warning');
  else showToast(`排课: ${best.placed}/${totalDemand}节，${best.errors.length}冲突，${empty}空位`,'warning');
}

function countEmpty(grid, N, ppd) {
  let e=0;
  for (let d=0;d<5;d++) for (let p=0;p<ppd;p++) for (let ci=0;ci<N;ci++) if(!grid[d][p][ci]) e++;
  return e;
}

function scheduleOnce(demand, classNums, N, ppd, m, seed) {
  const grid=[],walkGrid=[];
  for (let d=0;d<5;d++) { grid[d]=[];walkGrid[d]=[];for(let p=0;p<ppd;p++){grid[d][p]=[];for(let ci=0;ci<N;ci++)grid[d][p][ci]=null;walkGrid[d][p]=null;}}

  // Identify overflow classes where fixed demand exceeds available regular slots
  const overflowClassSet = new Set();
  classNums.forEach(c => {
    const cDemand = demand[String(c)];
    if (!cDemand) return;
    let fixedDemand = 0;
    Object.values(cDemand).forEach(v => { if (v.oddEven === null) fixedDemand += v.hours; });
    if (fixedDemand > 5 * ppd - (m && m.enabled ? 1 : 0)) overflowClassSet.add(c);
  });
  console.log('[排课] 溢出班级:', Array.from(overflowClassSet));

  // Build flat entry list: {classNum, subject, info, hours}
  const entries=[];
  classNums.forEach(c=>{
    const cDemand = demand[String(c)];
    if (!cDemand) return;
    Object.entries(cDemand).forEach(([demandKey,info])=>{
      if (!info || info.typeMode==='走班' || !info.subject) return;
      entries.push({classNum:c,subject:info.subject,info,hours:info.hours});
    });
  });

  // Sort by teacher: group entries by teacher, then sort groups by total hours desc
  // This ensures each teacher's courses across all classes are placed together
  const teacherGroups = {};
  entries.forEach(e => {
    const key = e.info.abbr || ('_'+e.subject+'_'+e.classNum);
    if (!teacherGroups[key]) teacherGroups[key] = [];
    teacherGroups[key].push(e);
  });
  // Sort each teacher's entries by hours desc; prioritize odd/even pairing only when overflow is detected later.
  Object.values(teacherGroups).forEach(g => g.sort((a,b) => b.hours - a.hours));
  // Sort teacher groups by total hours desc (most demanding teachers first)
  const sortedGroups = Object.values(teacherGroups).sort((a,b) => {
    const sumA = a.reduce((s,e) => s+e.hours, 0);
    const sumB = b.reduce((s,e) => s+e.hours, 0);
    return sumB - sumA;
  });
  // Shuffle within same-total-hours groups for variety across restarts
  let rng=seed;
  const rn=()=>{rng=(rng*1664525+1013904223)&0xFFFFFFFF;return rng/0xFFFFFFFF;};
  for (let i=0;i<sortedGroups.length;i++) {
    const sumI = sortedGroups[i].reduce((s,e)=>s+e.hours,0);
    let j=i+1;
    while (j<sortedGroups.length && sortedGroups[j].reduce((s,e)=>s+e.hours,0)===sumI) j++;
    // Fisher-Yates shuffle groups[i..j-1]
    for (let k=j-1;k>i;k--) { const r=i+Math.floor(rn()*(k-i+1)); [sortedGroups[k],sortedGroups[r]]=[sortedGroups[r],sortedGroups[k]]; }
    i=j-1;
  }
  const entriesByTeacher = sortedGroups.flat().filter(e => e && e.info && typeof e.classNum === 'number');
  console.log('[预配对] 总条目:', entriesByTeacher.length, 'odd:', entriesByTeacher.filter(e=>e&&e.info&&e.info.oddEven==='odd').length, 'even:', entriesByTeacher.filter(e=>e&&e.info&&e.info.oddEven==='even').length);

  // Pre-pairing: pair odd+even entries for the same class, place together
  // This ensures配对成功率接近100%
  try { classNums.forEach(c => {
    const ci = c - 1;
    const classEntries = entriesByTeacher.filter(e => e && e.info && e.classNum === c && e.info.oddEven && e.info.oddEven !== 'null');
    const oddEntries = classEntries.filter(e => e && e.info && e.info.oddEven === 'odd');
    const evenEntries = classEntries.filter(e => e && e.info && e.info.oddEven === 'even');
    // Pair up: match by hours (smallest first for better fit)
    const pairs = [];
    const usedOdd = new Set(), usedEven = new Set();
    for (let oi = 0; oi < oddEntries.length; oi++) {
      for (let ei = 0; ei < evenEntries.length; ei++) {
        if (usedOdd.has(oi) || usedEven.has(ei)) continue;
        pairs.push([oddEntries[oi], evenEntries[ei]]);
        usedOdd.add(oi);
        usedEven.add(ei);
        break;
      }
    }
    pairs.forEach(([oddE, evenE]) => {
      if (!oddE || !evenE || !oddE.info || !evenE.info) return;
      for (let h = 0; h < Math.min(oddE.hours, evenE.hours); h++) {
        // Find a slot where BOTH teachers are free and this class is empty
        let bestSlot = null, bestScore = -Infinity;
        for (let d = 0; d < 5; d++) {
          for (let p = 0; p < ppd; p++) {
            if (grid[d][p][ci]) continue; // cell occupied
            if (m && m.enabled && d === m.day && p === m.period) continue;
            if (oddE.info.allowedSlots && oddE.info.allowedSlots.length > 0 && !oddE.info.allowedSlots.includes(p + 1)) continue;
            if (evenE.info.allowedSlots && evenE.info.allowedSlots.length > 0 && !evenE.info.allowedSlots.includes(p + 1)) continue;
            // Check teacher conflicts for BOTH teachers across all other classes
            let conflict = false;
            for (let ci2 = 0; ci2 < N; ci2++) {
              if (ci2 === ci) continue;
              const cell = grid[d][p][ci2];
              if (!cell) continue;
              if (oddE.info.abbr && cell._teacherKey && cell._teacherKey.startsWith(oddE.info.abbr + '|')) { conflict = true; break; }
              if (oddE.info.abbr && cell.paired && cell.paired._teacherKey && cell.paired._teacherKey.startsWith(oddE.info.abbr + '|')) { conflict = true; break; }
              if (evenE.info.abbr && cell._teacherKey && cell._teacherKey.startsWith(evenE.info.abbr + '|')) { conflict = true; break; }
              if (evenE.info.abbr && cell.paired && cell.paired._teacherKey && cell.paired._teacherKey.startsWith(evenE.info.abbr + '|')) { conflict = true; break; }
            }
            if (conflict) continue;
            // Score: prefer days with fewer classes for both teachers
            let score = 0;
            if (oddE.info.abbr) {
              const tdc = tCountOnDay(oddE.info.abbr, d, grid, N, ppd);
              score += (4 - tdc) * 4;
            }
            if (evenE.info.abbr && evenE.info.abbr !== oddE.info.abbr) {
              const tdc2 = tCountOnDay(evenE.info.abbr, d, grid, N, ppd);
              score += (4 - tdc2) * 4;
            }
            score -= Math.abs(p - ppd / 2) * 0.15;
            if (score > bestScore) { bestScore = score; bestSlot = { d, p }; }
          }
        }
        if (bestSlot) {
          grid[bestSlot.d][bestSlot.p][ci] = {
            sub: oddE.subject, abbr: oddE.info.abbr, oddEven: 'odd',
            _teacherKey: teacherKey(oddE.info.abbr, c),
            paired: {
              sub: evenE.subject, abbr: evenE.info.abbr, oddEven: 'even',
              _teacherKey: teacherKey(evenE.info.abbr, c)
            }
          };
          oddE.hours--;
          evenE.hours--;
        }
      }
    });
  }); } catch(e) { console.warn('[预配对] 错误:', e.message); }

  // Remove fully consumed entries
  const finalEntries = entriesByTeacher.filter(e => e && e.hours > 0);
  // Rebuild teacher groups for remaining entries
  const remainingGroups = {};
  finalEntries.forEach(e => {
    const key = e.info.abbr || ('_' + e.subject + '_' + e.classNum);
    if (!remainingGroups[key]) remainingGroups[key] = [];
    remainingGroups[key].push(e);
  });
  const finalSorted = Object.values(remainingGroups).sort((a, b) => {
    return b.reduce((s, e) => s + e.hours, 0) - a.reduce((s, e) => s + e.hours, 0);
  });
  const entriesByTeacherFinal = finalSorted.flat();

  // Phase 1: greedy placement with strict constraints
  function placeEntries(elist) {
    if (!elist) return;
    elist.forEach(entry=>{
      if (!entry || !entry.info || typeof entry.hours !== 'number') return;
      for (let h=0;h<entry.hours;h++) {
        let bestSlot=null,bestScore=-Infinity;
        for (let d=0;d<5;d++) {
          for (let p=0;p<ppd;p++) {
            if (!slotOk(d,p,entry.classNum,entry.info,grid,N,ppd,m,true)) continue;
            let score=0;

            // Subject per-day cap: prefer ≤2, heavy penalty at 3+
            const subjToday = subjCountOnDay(entry.subject,entry.classNum,d,grid,N,ppd,entry.info.oddEven);
            if (subjToday >= 3) score -= 100;   // very heavy penalty but not hard skip
            else if (subjToday >= 2) score -= 20;
            else if (subjToday >= 1) score -= 2;

            // 0) Pairing: if cell has an existing odd/even/flex course that we can pair with
            const existCell = grid[d] && grid[d][p] ? grid[d][p][entry.classNum-1] : null;
            if (existCell && existCell.oddEven && !existCell.paired && entry.info.oddEven) {
              // Allow pairing: same subject with different weekType, OR different subject
              if (existCell.sub === entry.subject && existCell.oddEven === entry.info.oddEven) continue;
              score += 200; // very strong bonus — always prefer pairing over empty cell
            }

            // 1) Teacher weekly dispersion: prefer days where teacher has fewer classes
            const tDayCount = tCountOnDay(entry.info.abbr,d,grid,N,ppd);
            score += (4 - tDayCount) * 4;  // incentive to use underused days

            //    Penalty for high daily teacher load (based on reference: 4/day is normal)
            if (tDayCount >= 6) score -= 30;
            else if (tDayCount >= 5) score -= 10;
            else if (tDayCount >= 4) score -= 3;

            // 2) Teacher day balance: compare to other days
            //    Find the day with the fewest teacher classes
            let minDayCount = 999;
            for (let dd=0;dd<5;dd++) {
              const dc = tCountOnDay(entry.info.abbr,dd,grid,N,ppd);
              if (dc < minDayCount) minDayCount = dc;
            }
            if (tDayCount === minDayCount) score += 3; // bonus for picking the emptiest day

            // 4) Same-day clustering: if teacher already has classes on this day,
            //    prefer adjacent periods (contiguous block)
            if (tDayCount > 0) {
              // Find the nearest existing period for this teacher on day d
              let nearestDist = ppd;
              for (let pp=0;pp<ppd;pp++) {
                for (let ci2=0;ci2<N;ci2++) {
                  if (tKeyMatch(grid[d][pp][ci2],entry.info.abbr)) {
                    nearestDist = Math.min(nearestDist, Math.abs(p - pp));
                  }
                }
              }
              // Closer = better (adjacent periods get high bonus)
              if (nearestDist === 1) score += 5;   // directly adjacent
              else if (nearestDist === 2) score += 2; // one gap
              // same period = already occupied, won't reach here
            }

            // 5) Slight preference for morning periods for main subjects
            if (p < Math.ceil(ppd/2)) score += 0.5;

            // 6) Slight center preference (avoid extreme first/last period)
            score -= Math.abs(p - ppd/2) * 0.15;

            if (score>bestScore){bestScore=score;bestSlot={d,p};}
          }
        }
        if (bestSlot) {
            const ci = entry.classNum-1;
            const existingCell = grid[bestSlot.d][bestSlot.p][ci];
            if (existingCell && existingCell.oddEven && entry.info.oddEven && !existingCell.paired) {
              // Cell already has an odd/even/flex course — create paired structure
              let existOE = existingCell.oddEven;
              let newOE = entry.info.oddEven;
              if (existOE === 'flex' && newOE === 'flex') {
                existOE = 'odd'; newOE = 'even';
              } else if (existOE === 'flex') {
                existOE = newOE === 'odd' ? 'even' : 'odd';
              } else if (newOE === 'flex') {
                newOE = existOE === 'odd' ? 'even' : 'odd';
              }
              existingCell.oddEven = existOE;
              existingCell.paired = {
                sub:entry.subject, abbr:entry.info.abbr, oddEven:newOE,
                _teacherKey:teacherKey(entry.info.abbr,entry.classNum)
              };
            } else {
              // Empty cell — place normally
              grid[bestSlot.d][bestSlot.p][ci]={
                sub:entry.subject,abbr:entry.info.abbr,oddEven:entry.info.oddEven,
                _teacherKey:teacherKey(entry.info.abbr,entry.classNum)
              };
            }
          }
      }
    });
  }

  placeEntries(entriesByTeacherFinal);  // Phase 1: teacher-grouped placement

  // Phase 2: retry remaining (rebuild remaining list preserving teacher grouping)
  const remaining=[];
  const remainingGroups2 = {};
  entriesByTeacherFinal.forEach(entry=>{
    if (!entry || typeof entry.hours !== 'number') return;
    let placed=0;
    for (let d=0;d<5;d++) for (let p=0;p<ppd;p++) {
      const cell=grid[d][p][entry.classNum-1];
      if (cell&&cell.sub===entry.subject&&cell.abbr===entry.info.abbr) placed++;
      if (cell&&cell.paired&&cell.paired.sub===entry.subject&&cell.paired.abbr===entry.info.abbr) placed++;
    }
    if (placed<entry.hours) {
      const re = {...entry,hours:entry.hours-placed};
      remaining.push(re);
      const key = entry.info.abbr || ('_'+entry.subject+'_'+entry.classNum);
      if (!remainingGroups2[key]) remainingGroups2[key] = [];
      remainingGroups2[key].push(re);
    }
  });
  if (remaining.length) {
    const remainingSorted = Object.values(remainingGroups2).sort((a,b) => {
      return b.reduce((s,e)=>s+e.hours,0) - a.reduce((s,e)=>s+e.hours,0);
    }).flat();
    placeEntries(remainingSorted);  // Phase 2: retry remaining
  }

  // Phase 3: final desperate pass (same grouping)
  const remaining2=[];
  const remaining2Groups = {};
  remaining.forEach(entry=>{
    if (!entry || typeof entry.hours !== 'number') return;
    let placed=0;
    for (let d=0;d<5;d++) for (let p=0;p<ppd;p++) {
      const cell=grid[d][p][entry.classNum-1];
      if (cell&&cell.sub===entry.subject&&cell.abbr===entry.info.abbr) placed++;
      if (cell&&cell.paired&&cell.paired.sub===entry.subject&&cell.paired.abbr===entry.info.abbr) placed++;
    }
    if (placed<entry.hours) {
      const re = {...entry,hours:entry.hours-placed};
      remaining2.push(re);
      const key = entry.info.abbr || ('_'+entry.subject+'_'+entry.classNum);
      if (!remaining2Groups[key]) remaining2Groups[key] = [];
      remaining2Groups[key].push(re);
    }
  });
  if (remaining2.length) {
    const remaining2Sorted = Object.values(remaining2Groups).sort((a,b) => {
      return b.reduce((s,e)=>s+e.hours,0) - a.reduce((s,e)=>s+e.hours,0);
    }).flat();
    placeEntries(remaining2Sorted);  // Phase 3: final retry
  }

  // Phase 4: Swap mechanism — for still-unplaced courses, try relocating conflicting courses
  const remaining3 = [];
  remaining2.forEach(entry => {
    if (!entry || typeof entry.hours !== 'number') return;
    let placed = 0;
    for (let d=0;d<5;d++) for (let p=0;p<ppd;p++) {
      const cell = grid[d][p][entry.classNum-1];
      if (cell&&cell.sub===entry.subject&&cell.abbr===entry.info.abbr) placed++;
      if (cell&&cell.paired&&cell.paired.sub===entry.subject&&cell.paired.abbr===entry.info.abbr) placed++;
    }
    for (let h=0; h < entry.hours - placed; h++) remaining3.push({...entry, hours:1});
  });
  console.log('[排课] Phase 4 未排课程:', remaining3.length, '条');

  if (remaining3.length) {
    let swapPlaced = 0;
    remaining3.forEach(entry => {
      if (!entry || !entry.info) return;
      let placed = false;
      for (let d=0; d<5 && !placed; d++) {
        for (let p=0; p<ppd && !placed; p++) {
          if (m&&m.enabled&&d===m.day&&p===m.period) continue;
          const ci = entry.classNum-1;
          if (grid[d][p][ci]) continue; // target cell occupied
           if (entry.info.allowedSlots&&entry.info.allowedSlots.length>0&&!entry.info.allowedSlots.includes(p+1)) continue;

          // Check if there's a teacher conflict at this slot
          let conflictCi = -1;
          if (entry.info.abbr) {
            for (let ci2=0; ci2<N; ci2++) {
              if (ci2===ci) continue;
              const cell = grid[d][p][ci2];
              if (!cell) continue;
              if (cell._teacherKey&&cell._teacherKey.startsWith(entry.info.abbr+'|')) { conflictCi=ci2; break; }
              if (cell.paired&&cell.paired._teacherKey&&cell.paired._teacherKey.startsWith(entry.info.abbr+'|')) { conflictCi=ci2; break; }
            }
          }

          if (conflictCi < 0) {
            // No conflict, place directly
            grid[d][p][ci] = {sub:entry.subject,abbr:entry.info.abbr,oddEven:entry.info.oddEven,_teacherKey:teacherKey(entry.info.abbr,entry.classNum)};
            swapPlaced++; placed = true;
          } else {
            // Try to relocate the conflicting course to another slot
            const conflictCell = grid[d][p][conflictCi];
            if (!conflictCell || conflictCell.paired) continue; // can't move paired cells

            for (let d2=0; d2<5 && !placed; d2++) {
              for (let p2=0; p2<ppd && !placed; p2++) {
                if (d2===d && p2===p) continue;
                if (m&&m.enabled&&d2===m.day&&p2===m.period) continue;
                if (grid[d2][p2][conflictCi]) continue; // destination occupied

                // Check if conflict cell's teacher can go to (d2,p2)
                let canMove = true;
                if (conflictCell.abbr) {
                  for (let ci3=0; ci3<N; ci3++) {
                    if (ci3===conflictCi) continue;
                    const cell3 = grid[d2][p2][ci3];
                    if (!cell3) continue;
                    if (cell3._teacherKey&&cell3._teacherKey.startsWith(conflictCell.abbr+'|')) { canMove=false; break; }
                    if (cell3.paired&&cell3.paired._teacherKey&&cell3.paired._teacherKey.startsWith(conflictCell.abbr+'|')) { canMove=false; break; }
                  }
                }

                if (canMove) {
                  // Swap: move conflict cell to (d2,p2), place entry at (d,p)
                  grid[d2][p2][conflictCi] = conflictCell;
                  grid[d][p][ci] = {sub:entry.subject,abbr:entry.info.abbr,oddEven:entry.info.oddEven,_teacherKey:teacherKey(entry.info.abbr,entry.classNum)};
                  swapPlaced++; placed = true;
                }
              }
            }
          }
        }
      }
    });
    if (swapPlaced > 0) console.log('[排课] 交换机制成功排入', swapPlaced, '节课');
    else console.log('[排课] 交换机制未找到可用交换');
  }

  // Helper: walk day dispersion helpers
  function walkSubjOnDay(subj, d) {
    let c=0;
    for (let p=0;p<ppd;p++) {
      const w=walkGrid[d][p];
      if (w&&w.sub===subj) c++;
    }
    return c;
  }
  function walkTeacherOnDay(abbr, d) {
    let c=0;
    for (let p=0;p<ppd;p++) {
      const w=walkGrid[d][p];
      if (w&&w.abbr===abbr) c++;
    }
    return c;
  }

  // Phase 4: Walk classes with dispersion & co-period fallback for overflow classes
  const walkEntries=[];
  classNums.forEach(c=>{
    Object.entries(demand[String(c)]).forEach(([subj,info])=>{
      if (info.typeMode!=='走班') return;
      walkEntries.push({classNum:c,subject:subj,info,hours:info.hours});
    });
  });
  walkEntries.sort((a,b)=>b.hours-a.hours);

  walkEntries.forEach(entry=>{
    if (!entry || !entry.info || typeof entry.hours !== 'number') return;
    for (let h=0;h<entry.hours;h++) {
      let bestSlot=null, bestScore=-Infinity;
      for (let d=0;d<5;d++) {
        if (walkSubjOnDay(entry.subject,d)>=2) continue;
        if (walkTeacherOnDay(entry.info.abbr,d)>=4) continue;
        for (let p=0;p<ppd;p++) {
          if (m&&m.enabled&&d===m.day&&p===m.period) continue;
          if (walkGrid[d][p]) continue;
          const allowCoPeriod = overflowClassSet.has(entry.classNum);
          const regularCell = grid[d] && grid[d][p] ? grid[d][p][entry.classNum-1] : null;
          if (regularCell && !allowCoPeriod) continue;
          let conflict=false;
          for (let ci=0;ci<N&&!conflict;ci++) if (tKeyMatch(grid[d][p][ci],entry.info.abbr)) conflict=true;
          if (conflict) continue;
          if (p>0 && walkGrid[d][p-1] && walkGrid[d][p-1].sub===entry.subject) continue;
          if (p<ppd-1 && walkGrid[d][p+1] && walkGrid[d][p+1].sub===entry.subject) continue;

          let score=0;
          if (regularCell) score += 65;
          const subjDay = walkSubjOnDay(entry.subject,d);
          score -= subjDay * 6;
          const tDay = walkTeacherOnDay(entry.info.abbr,d);
          score += (4 - tDay) * 3;
          let minTD = 999;
          for (let dd=0;dd<5;dd++) { const dc=walkTeacherOnDay(entry.info.abbr,dd); if(dc<minTD) minTD=dc; }
          if (tDay===minTD) score += 2;
          if (tDay > 0) {
            let nearest = ppd;
            for (let pp=0;pp<ppd;pp++) {
              const w=walkGrid[d][pp];
              if (w&&w.abbr===entry.info.abbr) nearest=Math.min(nearest,Math.abs(p-pp));
            }
            if (nearest===1) score += 4;
            else if (nearest===2) score += 1.5;
          }
          if (p < Math.ceil(ppd/2)) score += 0.5;
          score -= Math.abs(p-ppd/2)*0.1;

          if (score>bestScore) { bestScore=score; bestSlot={d,p}; }
        }
      }
      if (bestSlot) walkGrid[bestSlot.d][bestSlot.p]={sub:entry.subject,abbr:entry.info.abbr};
    }
  });

  // Phase 5: Odd/Even week pairing — fill paired courses for single-week slots
  // Diagnostic: count odd/even cells and demand entries
  let oeCellCount = 0, oeDemandCount = 0, pairedCount = 0;
  for (let d=0;d<5;d++) for (let p=0;p<ppd;p++) for (let ci=0;ci<N;ci++) {
    const c = grid[d][p][ci];
    if (c && c.oddEven) oeCellCount++;
    if (c && c.paired) pairedCount++;
  }
  classNums.forEach(c => {
    const kd = String(c);
    if (demand[kd]) Object.entries(demand[kd]).forEach(([subj, info]) => {
      if (info.oddEven) oeDemandCount++;
    });
  });
  console.log(`[Phase5诊断] 奇偶单元格:${oeCellCount}, 奇偶需求:${oeDemandCount}, 已配对:${pairedCount}`);

  classNums.forEach(c => {
    const key = String(c);
    const ci = c - 1;
    if (ci < 0 || ci >= N) return;
    const classDemand = demand[key];
    if (!classDemand) return;

    // For each (d,p) slot in this class, check if it has an odd/even/flex course
    for (let d = 0; d < 5; d++) {
      for (let p = 0; p < ppd; p++) {
        const cell = grid[d][p][ci];
        if (!cell || !cell.oddEven) continue;       // skip if not odd/even/flex
        if (cell.paired) continue;                    // already paired

        // Determine what week types we can pair with
        const cellOE = cell.oddEven;
        // For odd cell -> want even or flex
        // For even cell -> want odd or flex
        // For flex cell -> want odd, even, or flex
        const acceptable = [];
        if (cellOE === 'odd') { acceptable.push('even'); acceptable.push('flex'); }
        else if (cellOE === 'even') { acceptable.push('odd'); acceptable.push('flex'); }
        else if (cellOE === 'flex') { acceptable.push('odd'); acceptable.push('even'); acceptable.push('flex'); }

        // Find a compatible unmet demand entry for this class
        let bestEntry = null;
        let bestHours = -1;
        Object.entries(classDemand).forEach(([subj, info]) => {
          if (info.typeMode === '走班') return;
          if (!info.oddEven || !acceptable.includes(info.oddEven)) return;

          // Count how many hours of this subject+weekType are already placed for this class
          // Must distinguish odd/even: only count cells matching this entry's weekType
          let placedH = 0;
          for (let dd = 0; dd < 5; dd++) {
            for (let pp = 0; pp < ppd; pp++) {
              const c2 = grid[dd][pp][ci];
              if (!c2) continue;
              // Check main cell
              if (c2.sub === info.subject && c2.abbr === info.abbr) {
                if (c2.oddEven === info.oddEven) placedH++;
                // Also count if the cell has a paired entry matching this weekType
                else if (c2.paired && c2.paired.sub === info.subject && c2.paired.abbr === info.abbr && c2.paired.oddEven === info.oddEven) placedH++;
              }
              // Check paired entry of OTHER cells too
              if (c2.paired && c2.paired.sub === info.subject && c2.paired.abbr === info.abbr && c2.paired.oddEven === info.oddEven) {
                if (c2.sub !== info.subject || c2.oddEven !== info.oddEven) placedH++;
              }
            }
          }
          const remainingH = info.hours - placedH;
          if (remainingH <= 0) return;

          // Check teacher conflict at (d,p) for this candidate
          if (info.abbr) {
            for (let ci2 = 0; ci2 < N; ci2++) {
              const existing = grid[d][p][ci2];
              if (existing && ci2 !== ci) {
                if (existing._teacherKey && existing._teacherKey.startsWith(info.abbr + '|')) return;
                if (existing.paired && existing.paired._teacherKey && existing.paired._teacherKey.startsWith(info.abbr + '|')) return;
              }
            }
          }

          // Check subject conflict in same cell (don't pair same subject+same weekType)
          if (cell.sub === info.subject && cell.oddEven === info.oddEven) return;

          if (remainingH > bestHours) {
            bestHours = remainingH;
            bestEntry = { sub: subj, abbr: info.abbr, oddEven: info.oddEven };
          }
        });

        if (bestEntry) {
          // Determine the actual odd/even for the paired entry
          let pairedOE = bestEntry.oddEven;
          if (pairedOE === 'flex') {
            // Flex determines its week type based on the cell's week type
            if (cellOE === 'odd') pairedOE = 'even';
            else if (cellOE === 'even') pairedOE = 'odd';
            else pairedOE = 'odd'; // flex+flex: first becomes odd
          }
          cell.paired = {
            sub: bestEntry.sub,
            abbr: bestEntry.abbr,
            oddEven: pairedOE,
            _teacherKey: teacherKey(bestEntry.abbr, c)
          };
        }
      }
    }
  });

  // Also pair flex grid cells that didn't get paired above with remaining demand
  classNums.forEach(c => {
    const key = String(c);
    const ci = c - 1;
    if (ci < 0 || ci >= N) return;
    const classDemand = demand[key];
    if (!classDemand) return;

    for (let d = 0; d < 5; d++) {
      for (let p = 0; p < ppd; p++) {
        const cell = grid[d][p][ci];
        if (!cell || cell.oddEven !== 'flex' || cell.paired) continue;

        // This flex cell wasn't paired. Try to pair with any unmet demand.
        const acceptable = ['odd', 'even', 'flex'];
        let bestEntry = null, bestHours = -1;
        Object.entries(classDemand).forEach(([subj, info]) => {
          if (info.typeMode === '走班') return;
          if (!info.oddEven || !acceptable.includes(info.oddEven)) return;
          let placedH = 0;
          for (let dd = 0; dd < 5; dd++) for (let pp = 0; pp < ppd; pp++) {
            const c2 = grid[dd][pp][ci];
            if (c2 && c2.sub === subj && c2.abbr === info.abbr) placedH++;
            if (c2 && c2.paired && c2.paired.sub === subj && c2.paired.abbr === info.abbr) placedH++;
          }
          if (info.hours - placedH <= 0) return;
          if (info.abbr) for (let ci2 = 0; ci2 < N; ci2++) {
            const ex = grid[d][p][ci2];
            if (ex && ci2 !== ci) {
              if (ex._teacherKey && ex._teacherKey.startsWith(info.abbr+'|')) return;
              if (ex.paired && ex.paired._teacherKey && ex.paired._teacherKey.startsWith(info.abbr+'|')) return;
            }
          }
          if (cell.sub === subj) return;
          const rem = info.hours - placedH;
          if (rem > bestHours) { bestHours = rem; bestEntry = { sub: subj, abbr: info.abbr, oddEven: info.oddEven }; }
        });

        if (bestEntry) {
          let pairedOE = bestEntry.oddEven;
          if (pairedOE === 'flex') pairedOE = 'even'; // flex+flex: second becomes even
          cell.paired = { sub: bestEntry.sub, abbr: bestEntry.abbr, oddEven: pairedOE, _teacherKey: teacherKey(bestEntry.abbr, c) };
        }
      }
    }
  });

  // Convert flex cells that got paired: update the main cell's oddEven to match
  for (let d=0;d<5;d++) for (let p=0;p<ppd;p++) for (let ci=0;ci<N;ci++) {
    const cell = grid[d][p][ci];
    if (cell && cell.oddEven === 'flex' && cell.paired) {
      // The paired entry is opposite, so this cell becomes the other side
      cell.oddEven = cell.paired.oddEven === 'odd' ? 'even' : 'odd';
    }
    // If still flex (not paired), leave as is - it will show as flex
  }

  // Count results
  let placed=0;
  for (let d=0;d<5;d++){for (let p=0;p<ppd;p++){for (let ci=0;ci<N;ci++)if(grid[d][p][ci])placed++;if(walkGrid[d][p])placed++;}}

  const unplaced = classNums.reduce((s,c)=>s+Object.values(demand[String(c)]).reduce((a,v)=>a+v.hours,0),0)-placed;

  const errors=[];
  if (unplaced>0) {
    remaining2.forEach(entry=>{
      if (!entry || !entry.info || typeof entry.hours !== 'number') return;
      let cnt=0;
      for (let d=0;d<5;d++)for(let p=0;p<ppd;p++){
        const cell=grid[d][p][entry.classNum-1];
        if (cell&&cell.sub===entry.subject&&cell.abbr===entry.info.abbr) cnt++;
      }
      if (cnt<entry.hours) errors.push(`${entry.info.teacherName}(${entry.subject}) ${entry.classNum}班 缺${entry.hours-cnt}课时`);
    });
  }

  return {grid,walkGrid,placed,unplaced,errors};
}
