async function ensureSheetJS() {
  if (window.XLSX) return;
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function exportExcel() {
  try {
    await ensureSheetJS();
  } catch (e) {
    showToast('加载 SheetJS 失败，请检查网络', 'error');
    return;
  }

  const wb = XLSX.utils.book_new();

  // Sheet 1: Teacher list
  const teacherData = [['科目', '姓名', '简称', '任教班级', '固定课时', '待定课时', '总课时', '班种']];
  state.subjects.forEach(subj => {
    const teachers = state.teachers[subj.name] || [];
    teachers.forEach(t => {
      const classes = [];
      const types = [];
      Object.entries(t.classTypeAssignments || {}).forEach(([ti, cls]) => {
        const ct = state.classTypes[parseInt(ti)];
        if (!ct) return;
        classes.push(ct.name + ':' + cls.join(','));
        types.push(ct.name + '(' + ct.mode + ')');
      });
      let sumFixed = 0, sumPending = 0;
      Object.values(t.classHours || {}).forEach(ch => {
        if (typeof ch === 'number') { sumFixed += ch; }
        else { sumFixed += ch.fixed || 0; sumPending += (ch.pending || 0) + (ch.single || 0) + (ch.double || 0); }
      });
      const totalH = sumFixed + sumPending;
      teacherData.push([subj.name, t.name, t.abbr, classes.join(' | '), sumFixed, sumPending, totalH, types.join('，')]);
    });
  });
  const ws1 = XLSX.utils.aoa_to_sheet(teacherData);
  XLSX.utils.book_append_sheet(wb, ws1, '教师列表');

  // Sheet 2: Schedule
  if (state.schedule) {
    const N = state.classCount;
    const ppd = state.periodsPerDay;
    const schedData = [];

    // Header row 1
    const row1 = ['节次'];
    for (let d = 0; d < 5; d++) {
      for (let ci = 0; ci < N; ci++) row1.push(DAYS[d] + (ci+1) + '班');
      row1.push(DAYS[d] + '走班');
    }
    schedData.push(row1);

    // Data rows
    for (let p = 0; p < ppd; p++) {
      // Lunch break
      if (p === Math.ceil(ppd / 2)) {
        const lunchRow = ['午休'];
        for (let d = 0; d < 5; d++) {
          for (let ci = 0; ci < N; ci++) lunchRow.push('');
          lunchRow.push('');
        }
        schedData.push(lunchRow);
      }

      const row = ['第' + (p+1) + '节'];
      for (let d = 0; d < 5; d++) {
        for (let ci = 0; ci < N; ci++) {
          const cell = state.schedule.grid[d][p][ci];
          let cellText = cell ? cell.sub + cell.abbr : '';
          if (cell && cell.oddEven) {
            const oeLabel = cell.oddEven==='odd'?'[单]':cell.oddEven==='even'?'[双]':'[待]';
            cellText = oeLabel + cellText;
          }
          if (cell && cell.paired) {
            const pOE = cell.paired.oddEven==='odd'?'[单]':'[双]';
            cellText += '\n' + pOE + cell.paired.sub + cell.paired.abbr;
          }
          row.push(cellText);
        }
        const wc = state.schedule.walkGrid[d][p];
        row.push(wc ? wc.sub + wc.abbr : '');
      }
      schedData.push(row);
    }

    const ws2 = XLSX.utils.aoa_to_sheet(schedData);
    XLSX.utils.book_append_sheet(wb, ws2, '课程表');
  }

  XLSX.writeFile(wb, '排课系统导出.xlsx');
  showToast('导出成功', 'success');
}

/* ============================================================
   EXCEL IMPORT
   ============================================================ */
function triggerImport() {
  document.getElementById('importFileInput').click();
}

async function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';

  try {
    await ensureSheetJS();
  } catch (e) {
    showToast('加载 SheetJS 失败', 'error');
    return;
  }

  const data = await file.arrayBuffer();
  const wb = XLSX.read(data, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });

  if (!rows.length) { showToast('文件为空', 'warning'); return; }

  // Find header row: look for row containing "序号" AND "姓名"
  let headerIdx = -1;
  for (let r = 0; r < Math.min(10, rows.length); r++) {
    const row = rows[r];
    if (!row) continue;
    const text = row.map(c => (c || '').toString()).join('');
    if (text.includes('序号') && text.includes('姓名')) {
      headerIdx = r;
      break;
    }
  }

  if (headerIdx < 0) { showToast('无法识别表格格式', 'warning'); return; }

  const header = rows[headerIdx].map(h => (h || '').toString().trim());

  // Detect all regions by finding "序号" columns
  const regionStarts = [];
  for (let i = 0; i < header.length; i++) {
    if (header[i] === '序号') regionStarts.push(i);
  }

  if (!regionStarts.length) { showToast('未找到数据区域', 'warning'); return; }

  // For each region, detect local column offsets
  const regions = regionStarts.map(start => {
    const map = { start };
    // Scan up to 7 columns from start for local headers
    for (let i = start; i < Math.min(start + 7, header.length); i++) {
      const h = header[i];
      if (h === '序号') map.idx = i;
      else if (h.includes('科目')) map.subject = i;
      else if (h.includes('姓名')) map.name = i;
      else if (h.includes('简称')) map.abbr = i;
      else if (h.includes('任教') || h.includes('班级')) map.classes = i;
      else if (h === '上课' || h.includes('课时')) map.hours = i;
    }
    return map;
  });

  // Filter regions that have at least name column
  const validRegions = regions.filter(r => r.name !== undefined);
  if (!validRegions.length) { showToast('未找到有效的教师数据列', 'warning'); return; }

  // Skip entries that are clearly not teachers
  const skipPatterns = ['产假', '退休', '心理健康', '内宿生管理', '计算机', '听说训练', '合计', '各班组合', '各 班 组 合', '班主任'];
  function shouldSkip(str) {
    if (!str) return false;
    return skipPatterns.some(p => str.includes(p));
  }

  // Parse class string with walk class support
  function parseClassesFull(str) {
    if (!str) return { regular: [], walk: [] };
    const s = str.toString().trim();
    if (shouldSkip(s)) return { regular: [], walk: [] };

    const regular = [];
    const walk = [];

    let working = s;

    // Remove "合格性X-Y班" segments (qualifying exam, not real classes)
    working = working.replace(/合格性\s*\d+\s*[-~—]\s*\d+\s*班?/g, '');
    // Also remove standalone "合格性" if it somehow remains
    working = working.replace(/合格性/g, '');

    // Check if string starts with "走班" - if so, all classes are walk
    const startsWithWalk = /^\s*走班/.test(working);

    // Extract explicit "走班N" patterns
    const walkMatches = working.match(/走班\s*(\d+)/g);
    if (walkMatches) {
      walkMatches.forEach(m => {
        const n = parseInt(m.replace(/走班\s*/, ''));
        if (!isNaN(n)) walk.push(n);
      });
      working = working.replace(/走班\s*\d+/g, '');
    }

    // Parse remaining numbers as classes
    const parts = working.replace(/班/g, '').split(/[、，,\s]+/);
    parts.forEach(p => {
      p = p.trim();
      if (!p) return;
      const rangeMatch = p.match(/^(\d+)\s*[-~—]\s*(\d+)$/);
      if (rangeMatch) {
        const a = parseInt(rangeMatch[1]), b = parseInt(rangeMatch[2]);
        for (let i = a; i <= b; i++) {
          if (startsWithWalk) walk.push(i); else regular.push(i);
        }
      } else {
        const n = parseInt(p);
        if (!isNaN(n) && n >= 1) {
          if (startsWithWalk) walk.push(n); else regular.push(n);
        }
      }
    });

    return {
      regular: [...new Set(regular)].sort((a, b) => a - b),
      walk: [...new Set(walk)].sort((a, b) => a - b)
    };
  }

  // Parse data rows
  const imported = [];
  let detectedClassCount = state.classCount;

  validRegions.forEach(region => {
    // Track current subject for inheritance
    let currentSubject = '';

    for (let r = headerIdx + 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row || !row.length) continue;

      const name = region.name !== undefined ? (row[region.name] || '').toString().trim() : '';
      if (!name) continue;
      if (shouldSkip(name)) continue;

      // Subject: use current cell if present, otherwise inherit
      let subjectRaw = region.subject !== undefined ? (row[region.subject] || '').toString().trim() : '';
      if (subjectRaw) {
        // Extract subject name: "语文14" -> "语文", "化学6" -> "化学"
        currentSubject = subjectRaw.replace(/\d+$/, '').trim();
      }
      const subject = currentSubject;
      if (!subject) continue;

      const abbr = region.abbr !== undefined ? (row[region.abbr] || '').toString().trim() : '';
      if (!abbr) continue; // Skip rows without abbreviation (likely not a teacher)

      const classesStr = region.classes !== undefined ? (row[region.classes] || '').toString().trim() : '';
      if (shouldSkip(classesStr)) continue;

      const hoursVal = region.hours !== undefined ? row[region.hours] : 0;
      const hours = parseFloat(hoursVal) || 0;

      // Parse classes
      const { regular, walk } = parseClassesFull(classesStr);

      // Skip if no valid classes at all (e.g. only had "合格性" classes, or no classes)
      if (regular.length === 0 && walk.length === 0) continue;

      // Build classTypeAssignments: default all to 常规班 (typeIdx 0)
      const classTypeAssignments = {};
      if (regular.length) {
        classTypeAssignments[0] = regular; // 0 = first type (常规班)
        regular.forEach(c => { if (c > detectedClassCount) detectedClassCount = c; });
      }
      if (walk.length) {
        // Find or create 走班 type
        let walkTypeIdx = state.classTypes.findIndex(ct => ct.mode === '走班');
        if (walkTypeIdx < 0) walkTypeIdx = -1; // will be handled at import
        classTypeAssignments[walkTypeIdx >= 0 ? walkTypeIdx : -1] = walk;
        walk.forEach(c => { if (c > detectedClassCount) detectedClassCount = c; });
      }

      imported.push({
        name: name,
        abbr: abbr,
        subject: subject,
        hours: hours,
        classTypeAssignments: classTypeAssignments
      });
    }
  });

  if (!imported.length) { showToast('未解析到教师数据', 'warning'); return; }

  // Show preview modal
  importPreviewData = { imported, detectedClassCount, header, regionCount: validRegions.length };
  renderImportPreview();
  document.getElementById('importModalOverlay').classList.add('show');
}

function renderImportPreview() {
  const body = document.getElementById('importModalBody');
  if (!importPreviewData) return;
  const { imported, detectedClassCount, regionCount } = importPreviewData;

  let html = '<div class="import-info">';
  html += `<p>识别到 <strong>${regionCount || 1}</strong> 个数据区域，解析到 <strong>${imported.length}</strong> 位教师</p>`;
  html += `<p>检测到班级数: <strong>${detectedClassCount}</strong>（所有班级默认为常规班）</p>`;
  html += '</div>';

  html += `<div class="import-checkbox-row">
    <input type="checkbox" class="import-checkbox" id="syncClassCount" checked>
    <label for="syncClassCount">同步班级数为 ${detectedClassCount}</label>
  </div>`;

  html += '<table class="import-table"><thead><tr><th>姓名</th><th>简称</th><th>科目</th><th>周课时</th><th>任教班级</th></tr></thead><tbody>';
  imported.forEach((t, i) => {
    let classStr = '';
    Object.entries(t.classTypeAssignments).forEach(([ti, cls]) => {
      const idx = parseInt(ti);
      const ct = idx >= 0 ? state.classTypes[idx] : null;
      const typeName = ct ? ct.name : (idx === -1 ? '走班' : '未知');
      classStr += (classStr ? ' | ' : '') + typeName + ':' + cls.join(',');
    });
    html += `<tr>
      <td><input value="${esc(t.name)}" onchange="importPreviewData.imported[${i}].name=this.value"></td>
      <td><input value="${esc(t.abbr)}" onchange="importPreviewData.imported[${i}].abbr=this.value" style="width:60px"></td>
      <td><input value="${esc(t.subject)}" onchange="importPreviewData.imported[${i}].subject=this.value" style="width:60px"></td>
      <td><input type="number" value="${t.hours}" onchange="importPreviewData.imported[${i}].hours=parseInt(this.value)||0" style="width:50px"></td>
      <td style="font-size:0.78rem;color:var(--text-secondary)">${esc(classStr || '-')}</td>
    </tr>`;
  });
  html += '</tbody></table>';

  body.innerHTML = html;
}

function closeImportModal() {
  document.getElementById('importModalOverlay').classList.remove('show');
  importPreviewData = null;
}

function confirmImport() {
  if (!importPreviewData) return;
  pushUndo();

  const syncEl = document.getElementById('syncClassCount');
  if (syncEl && syncEl.checked) {
    state.classCount = importPreviewData.detectedClassCount;
  }

  // Ensure 走班 type exists if any walk classes are imported
  const hasWalkClasses = importPreviewData.imported.some(t => t.classTypeAssignments[-1]);
  if (hasWalkClasses && state.classTypes.findIndex(ct => ct.mode === '走班') < 0) {
    const slots = [];
    for (let i = 1; i <= state.periodsPerDay; i++) slots.push(i);
    state.classTypes.push({ name: '走班', mode: '走班', weekType: '每周', fixedHours: 0, allowedSlots: slots });
  }

  // Re-map walk class type index from -1 to actual index
  const walkTypeIdx = state.classTypes.findIndex(ct => ct.mode === '走班');

  // Ensure subjects exist
  const imported = importPreviewData.imported;
  const subjectSet = new Set(state.subjects.map(s => s.name));
  imported.forEach(t => {
    if (t.subject && !subjectSet.has(t.subject)) {
      const colors = ['#c0392b','#2980b9','#27ae60','#8e44ad','#d35400','#16a085','#f39c12'];
      state.subjects.push({ name: t.subject, color: colors[state.subjects.length % colors.length] });
      subjectSet.add(t.subject);
    }
  });

  // Add teachers
  imported.forEach(t => {
    if (!t.subject) return;
    if (!state.teachers[t.subject]) state.teachers[t.subject] = [];

    // Fix classTypeAssignments: remap -1 to actual walkTypeIdx
    const fixedAssignments = {};
    Object.entries(t.classTypeAssignments).forEach(([key, cls]) => {
      const k = parseInt(key);
      if (k === -1 && walkTypeIdx >= 0) {
        fixedAssignments[walkTypeIdx] = cls;
      } else if (k >= 0) {
        fixedAssignments[k] = cls;
      }
    });

    // Auto-distribute hours
    const classes = [];
    Object.values(fixedAssignments).forEach(cls => cls.forEach(c => { if (!classes.includes(c)) classes.push(c); }));
    const n = classes.length;
    const base = n ? Math.floor(t.hours / n) : 0;
    let rem = n ? t.hours - base * n : 0;
    const classHours = {};
    classes.sort((a, b) => a - b).forEach(c => {
      const h = base + (rem > 0 ? 1 : 0);
      classHours[c] = { fixed: h, single: 0, double: 0, pending: 0 };
      if (rem > 0) rem--;
    });

    state.teachers[t.subject].push({
      name: t.name,
      abbr: t.abbr,
      classTypeAssignments: fixedAssignments,
      hours: t.hours,
      classHours
    });
  });

  closeImportModal();
  render();
  showToast(`成功导入 ${imported.length} 位教师`, 'success');
}

/* ============================================================
   CLEAR ALL
   ============================================================ */
function clearAll() {
  pushUndo();
  state = createDefaultState();
  render();
  showToast('已清空所有数据，可撤销恢复', 'info');
}

/* ============================================================
   UTILITIES
   ============================================================ */
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function setupEventHandlers() {
  // Navbar inputs
  document.getElementById('inputClassCount').addEventListener('change', function() {
    const val = parseInt(this.value);
    if (val >= 1 && val <= 30 && val !== state.classCount) {
      pushUndo();
      state.classCount = val;
      // Update allowed slots for all types
      state.classTypes.forEach(ct => {
        ct.allowedSlots = ct.allowedSlots.filter(s => s <= state.periodsPerDay);
      });
      render();
    }
  });

  document.getElementById('inputPeriods').addEventListener('change', function() {
    const val = parseInt(this.value);
    if (val >= 1 && val <= 12 && val !== state.periodsPerDay) {
      pushUndo();
      state.periodsPerDay = val;
      state.classTypes.forEach(ct => {
        ct.allowedSlots = ct.allowedSlots.filter(s => s <= val);
      });
      if (state.classMeeting.period >= val) state.classMeeting.period = val - 1;
      render();
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
    }
  });

  // Close modals on overlay click
  document.getElementById('configModalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeConfigModal();
  });
  document.getElementById('importModalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeImportModal();
  });
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  loadFromLocal();
  setupEventHandlers();
  render();
  updateUndoRedoButtons();
}

// Run on DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>
